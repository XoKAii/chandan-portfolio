<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rect -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Subtle Grid lines -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.15"/>
  <line x1="32" y1="2" x2="32" y2="62" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.15"/>
  <!-- CY Monogram Text -->
  <text x="32" y="41" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="25" font-weight="800" fill="url(#blueGrad)" text-anchor="middle" letter-spacing="-1.5" filter="url(#glow)">CY</text>
  <!-- Accent Pulse Dot -->
  <circle cx="50" cy="15" r="3" fill="#38BDF8"/>
</svg>
